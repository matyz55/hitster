<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Songster – duży ekran</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <style>
    :root { --u: max(1px, calc(100vw / 1920)); --bg: #12101a; --panel: #1d1a29; --panel-2: #272338; --text: #f3f0ff; --muted: #a49cbf;
      --accent: #ff3d7f; --accent-2: #2de2e6; --ok: #3ddc84; --bad: #ff5c5c; --gold: #ffc93c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(ellipse at 15% -10%, #2c2150 0%, transparent 55%), radial-gradient(ellipse at 100% 110%, #1d2a4a 0%, transparent 50%), var(--bg);
      background-color: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: clamp(16px, 1.6vw, calc(64 * var(--u))); overflow: hidden; }
    /* margines bezpieczny ok. 5% – część telewizorów obcina brzegi obrazu (overscan) */
    .wrap { height: 100%; display: flex; flex-direction: column; padding: 4.5vh 5vw; gap: 1.6vh; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
    h1 { margin: 0; font-size: 1.8em; white-space: nowrap; }
    .many h1 { font-size: 1.4em; }
    .many .score { font-size: .8em; padding: .25em .6em; }
    .info { color: var(--gold); font-size: 1.1em; }
    .scores { display: flex; gap: 1vw; flex-wrap: wrap; }
    .score { background: var(--panel); border: calc(3 * var(--u)) solid transparent; border-radius: calc(14 * var(--u)); padding: .4em .9em; font-size: 1.05em; }
    .score.active { border-color: var(--accent); }
    .main { display: flex; gap: 2.5vw; align-items: center; flex-shrink: 0; background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 1em; padding: .7em 1.2em; }
    .vinyl { width: min(16vh, 6em); height: min(16vh, 6em); border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 calc(4 * var(--u)) #000;
      background: repeating-radial-gradient(circle, #111 0 calc(3 * var(--u)), #222 calc(3 * var(--u)) calc(6 * var(--u))); display: grid; place-items: center; background-size: cover; background-position: center; }
    .compact .vinyl { width: min(10vh, 4em); height: min(10vh, 4em); }
    .compact .reveal .year { font-size: 2.2em; }
    .vinyl .lbl { width: 38%; height: 38%; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 1.6em; }
    .vinyl.cover .lbl { display: none; }
    .status { font-size: 1.3em; }
    .reveal { margin-top: .4em; }
    .reveal .year { font-size: 3em; font-weight: 900; color: var(--gold); line-height: 1; }
    .reveal .song { font-size: 1.5em; }
    .reveal .lines div { margin-top: .2em; font-weight: 700; }
    .hint { color: var(--accent-2); font-size: 1.2em; flex-shrink: 0; }
    .hint:empty { display: none; }
    /* przyciski jak w oknie gry – można je klikać także tutaj */
    .actions { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; flex-shrink: 0; }
    .actions:empty { display: none; }
    .actions button { font-size: .8em; border: 0; border-radius: calc(10 * var(--u)); padding: .45em .9em; color: var(--text); background: var(--panel-2); }
    .actions button.primary { background: var(--accent); font-weight: 600; }
    .actions button.ghost { background: transparent; border: calc(1 * var(--u)) solid #3d3755; }
    .actions button.ok { background: var(--ok); color: #0b1d12; font-weight: 600; }
    .actions button.gold { background: var(--gold); color: #2b2000; font-weight: 600; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions .note { color: var(--muted); font-size: .8em; }
    /* osie czasu: zawsze wszystkie, rozmiar kart liczony w tv.js tak, by zmieściły się bez przewijania */
    .timelines { flex: 1; min-height: 0; overflow: hidden; display: grid; gap: 1vh 1.5vw; }
    .tl-row { display: flex; align-items: center; gap: .8vw; min-height: 0; min-width: 0; border-radius: calc(14 * var(--u)); padding: 0 .4vw; }
    .tl-row.active { grid-column: 1 / -1; }
    /* oś gracza z turą – tylko delikatny znacznik z boku (przy kilku osiach) */
    .timelines.multi .tl-row.active { background: rgba(255, 255, 255, .035); box-shadow: inset calc(5 * var(--u)) 0 0 var(--accent); }
    .tl-name { width: 11vw; flex-shrink: 0; font-weight: 800; font-size: var(--nfs, 1em); line-height: 1.15; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tl-name small { display: block; font-weight: 400; color: var(--muted); font-size: .7em; white-space: normal; }
    .tl-row.active .tl-name small { font-size: .55em; }
    .tl-row.active .tl-name { color: var(--accent); }
    .tl { display: flex; gap: var(--gap, .5vw); overflow: hidden; flex: 1; align-items: center; justify-content: center; }
    /* karta: rok, tytuł (2 linijki), wykonawca (2 linijki), flaga */
    .card { flex: 0 0 auto; width: var(--cw, 11vw); height: var(--ch, 14vh); border-radius: .8em; padding: .5em .45em; text-align: center; overflow: hidden;
      font-size: var(--fs, 1em); background: linear-gradient(165deg, #43367a 0%, #2c2552 100%); border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 .35em 1em rgba(0, 0, 0, .35); display: flex; flex-direction: column; justify-content: center; gap: .3em; }
    .card .y { font-size: 1.9em; font-weight: 900; color: var(--gold); line-height: 1.05; }
    .card .t { font-weight: 700; font-size: .85em; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .a { color: var(--muted); font-size: .72em; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .lbl { color: var(--muted); font-size: .7em; }
    .flag { width: 1.6em; height: auto; border-radius: calc(3 * var(--u)); vertical-align: -0.15em; }
    .card .flag { width: 1.3em; align-self: center; }
    .tiny .card .a, .tiny .card .flag, .tiny .card .lbl { display: none; }
    .tiny .card .t { -webkit-line-clamp: 1; }
    .tiny .card .y { font-size: 1.6em; }
    .tiny .card { justify-content: center; gap: .2em; }
    .card.start { background: rgba(255, 201, 60, .06); border: calc(3 * var(--u)) dashed rgba(255, 201, 60, .8); box-shadow: none; }
    .card.new { outline: calc(4 * var(--u)) solid var(--ok); }
    .card.mystery { background: linear-gradient(160deg, var(--accent), #b0245a); border: calc(3 * var(--u)) solid #fff; justify-content: center; gap: .2em;
      animation: pulse 1.2s ease-in-out infinite; }
    .card.mystery.ch { background: linear-gradient(160deg, var(--gold), #c48a00); color: #1d1a29; }
    .card.mystery .q { font-size: 2.6em; font-weight: 900; line-height: 1; }
    .card.mystery .who { font-weight: 800; font-size: .8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @keyframes pulse { 50% { transform: translateY(-.25em); box-shadow: 0 .5em 1.2em rgba(0, 0, 0, .5); } }
    .mark { flex: 0 0 auto; width: calc(var(--cw, 11vw) * .55); height: var(--ch, 14vh); border-radius: .7em; display: grid; place-items: center; text-align: center;
      font-size: var(--fs, 1em); font-weight: 800; border: calc(3 * var(--u)) dashed; padding: .2em; overflow: hidden; }
    .mark.bad { color: var(--bad); border-color: var(--bad); }
    .mark.ok { color: var(--ok); border-color: var(--ok); }
    .mark.challenge { color: var(--gold); border-color: var(--gold); }
    .end h2 { font-size: 2.6em; margin: 0 0 .4em; }
    .end ol { font-size: 1.4em; }
    .waiting { margin: auto; text-align: center; color: var(--muted); font-size: 1.4em; }
    .waiting b { color: var(--text); font-size: 1.6em; display: block; margin-bottom: .5em; }
    button { font: inherit; font-size: .7em; border: calc(1 * var(--u)) solid #3d3755; background: transparent; color: var(--text); border-radius: calc(10 * var(--u)); padding: .4em .9em; cursor: pointer; }
    .hidden { display: none !important; }
    /* informacja (bez blokowania gry): dźwięk tutaj czeka na naciśnięcie przycisku pilota */
    .sound-unlock { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); max-width: 80vw; z-index: 50; font-size: .75em; font-weight: 600;
      padding: .6em 1.1em; border-radius: 999px; background: rgba(20, 18, 30, .92); color: var(--text); border: 1px solid #3d3755; text-align: center; pointer-events: none; }
    body.player .sound-unlock { font-size: 14px; bottom: 12px; }
    .sound-tip { color: var(--muted); font-size: .8em; margin-top: 1em; }
    /* ekran po połączeniu telefonu i ekran ustawień gry */
    .connected { margin: auto; text-align: center; }
    .connected .big { font-size: 3em; }
    .connected h1 { font-size: 2.4em; margin: .2em 0; }
    .connected p { color: var(--muted); font-size: 1.2em; }
    .setup-board { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 1fr; gap: 4vw; align-items: center; }
    .setup-board.single { grid-template-columns: 1fr; max-width: 60vw; margin: auto; }
    .sb-kicker { color: var(--accent-2); text-transform: uppercase; letter-spacing: .12em; font-size: .8em; font-weight: 700; }
    .sb-left h1 { font-size: 2.2em; margin: .1em 0 .5em; white-space: normal; }
    .sb-sub { color: var(--muted); font-size: .85em; margin-bottom: .3em; }
    .sb-players .chips { display: flex; flex-wrap: wrap; gap: .4em; margin-bottom: .9em; }
    .pchip { background: var(--panel-2); border: 1px solid rgba(255, 255, 255, .1); border-radius: 2em; padding: .25em .8em; font-weight: 700; }
    .sb-opts { display: grid; grid-template-columns: auto 1fr; gap: .3em 1.2em; margin: 0; font-size: .9em; }
    .sb-opts dt { color: var(--muted); }
    .sb-opts dd { margin: 0; font-weight: 600; }
    .sb-pool { color: var(--muted); font-size: .75em; margin-top: 1em; }
    .sb-right { text-align: center; }
    .sb-qr { width: min(52vh, 34vw); aspect-ratio: 1; margin: 0 auto; background: #fff; border-radius: 2vmin; padding: 2vmin; }
    .sb-qr svg { width: 100%; height: 100%; display: block; }
    .sb-code { color: var(--gold); font-weight: 900; font-size: clamp(2rem, 9vmin, 9rem); letter-spacing: .12em; margin-top: .2em; line-height: 1.1; }
    .sb-right p { color: var(--text); font-size: 1em; margin: .3em 0 0; }
    /* płyta kręci się, gdy gra muzyka; pasek postępu fragmentu */
    .vinyl.spinning { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress { height: .35em; background: var(--panel-2); border-radius: 1em; overflow: hidden; margin-bottom: .5em; max-width: 30em; }
    .progress .bar { height: 100%; width: 0; background: var(--accent-2); transition: width .25s linear; }
    /* Melodia krok po kroku */
    .steps { display: flex; gap: .5em; flex-shrink: 0; }
    .step { flex: 1; display: flex; flex-direction: column; align-items: center; padding: .3em; border-radius: .5em; background: var(--panel-2);
      border: calc(1 * var(--u)) solid #3d3755; color: var(--muted); line-height: 1.2; }
    .step b { color: var(--text); }
    .step small { font-size: .7em; }
    .step.done { opacity: .45; }
    .step.current { border-color: var(--gold); background: rgba(255, 201, 60, .14); }
    .step.current b { color: var(--gold); }
    /* Kto pierwszy? */
    .buzzers { display: flex; flex-wrap: wrap; gap: .5em; flex-shrink: 0; align-items: center; }
    .buzzer { font: inherit; font-size: .9em; border: calc(3 * var(--u)) solid var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--text);
      border-radius: .6em; padding: .4em .8em; display: flex; gap: .5em; align-items: center; cursor: pointer; }
    .buzzer kbd { background: var(--c); color: #12101a; border-radius: .3em; padding: 0 .35em; font-weight: 800; }
    .buzzer.locked { opacity: .35; }
    .buzzer.answering { background: var(--c); color: #12101a; }
    .buzzers.mine .buzzer { flex: 1; justify-content: center; font-size: 1.6em; padding: .8em; }
    .buzz-who { font-weight: 800; color: var(--gold); }
    /* połączenie z innym urządzeniem */
    /* kod do połączenia z telefonem: QR (biały, kontrastowy) obok dużego kodu – dopasowane do wysokości ekranu */
    .net-box { margin: 3vh auto 0; display: flex; gap: 4vmin; align-items: center; justify-content: center; flex-wrap: wrap; }
    .net-qr { width: min(48vh, 70vw); aspect-ratio: 1; background: #fff; border-radius: 2vmin; padding: 2vmin; box-sizing: border-box; }
    .net-qr svg { width: 100%; height: 100%; display: block; }
    .net-info { text-align: left; max-width: min(40vw, 90vw); }
    .net-label { color: var(--muted); font-size: 1em; }
    .net-code { color: var(--gold); font-weight: 900; font-size: clamp(2.5rem, 14vmin, 12rem); letter-spacing: .12em; line-height: 1.1; }
    .net-info p { color: var(--text); font-size: .8em; margin: .8em 0 0; }
    .waiting.with-code { margin: auto; }
    .waiting.with-code b { margin-bottom: .2em; }
    /* telefon gracza */
    .gap { flex: 0 0 auto; width: calc(var(--cw, 11vw) * .4); height: var(--ch, 14vh); border-radius: .6em; border: 2px dashed var(--accent-2);
      background: rgba(45, 226, 230, .08); color: var(--accent-2); font: inherit; font-size: calc(var(--fs, 1em) * 1.6); cursor: pointer; padding: 0; }
    .others { display: flex; flex-wrap: wrap; gap: .3em .9em; font-size: .8em; color: var(--muted); flex-shrink: 0; }
    .others b { color: var(--text); }
    .me-bar { color: var(--muted); font-size: .8em; flex-shrink: 0; }
    .link { background: none; border: 0; color: var(--accent-2); text-decoration: underline; padding: 0; font-size: 1em; }
    .picker { margin: 1em auto; text-align: center; }
    .picker-list { display: flex; flex-wrap: wrap; gap: .5em; justify-content: center; }
    .picker-list button { font-size: 1em; padding: .6em 1em; background: var(--panel-2); border: 0; }
    .picker-list button.primary { background: var(--accent); }
    .join-form { display: flex; gap: .5em; justify-content: center; flex-wrap: wrap; margin: .6em 0; }
    .join-form input { font: inherit; padding: .5em .7em; border-radius: .5em; border: 1px solid #3d3755; background: var(--panel); color: var(--text); min-width: 10em; }
    .join-form button { font-size: 1em; padding: .5em 1em; }
    .guess-form { display: flex; gap: .5em; flex-wrap: wrap; flex-shrink: 0; }
    .guess-form input { font: inherit; padding: .4em .6em; border-radius: .5em; border: 1px solid #3d3755; background: var(--panel); color: var(--text); flex: 1; min-width: 8em; }
    .guess-form button { font-size: .9em; }
    .guess-form .suggest-wrap { position: relative; flex: 1 1 100%; display: flex; }
    .suggest { position: absolute; left: 0; right: 0; bottom: calc(100% + 4px); z-index: 5; margin: 0; padding: 4px; list-style: none; max-height: 40vh; overflow-y: auto;
      background: var(--panel-2); border: 1px solid #3d3755; border-radius: .6em; font-size: .9em; }
    .suggest li { padding: .4em .5em; border-radius: .4em; cursor: pointer; }
    .suggest li span { color: var(--muted); }
    .suggest li:hover { background: rgba(255, 61, 127, .18); }
    .actions button.primary, .guess-form button.primary { background: var(--accent); border: 0; color: var(--text); font-weight: 600; }
    body.player { overflow: auto; }
    /* --- osobny widok telefonu gracza --- */
    body.player .wrap { font-size: 17px; gap: 12px; padding: 14px 14px 28px; }
    .p-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .p-me b { font-size: 1.2em; }
    .p-me small { display: block; color: var(--muted); font-size: .85em; }
    .p-banner { background: var(--panel); border-radius: 14px; padding: 12px 14px; font-size: 1.15em; font-weight: 800; text-align: center; }
    .p-banner.mine { background: var(--accent); color: #fff; animation: glow 1.6s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow: 0 0 1.2em rgba(255, 61, 127, .55); } }
    .p-status { color: var(--muted); text-align: center; }
    .p-status.playing { color: var(--accent-2); }
    .p-reveal { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
    .p-reveal .y { font-size: 2.4em; font-weight: 900; color: var(--gold); line-height: 1; }
    .p-reveal .t { font-weight: 800; font-size: 1.15em; margin-top: 4px; }
    .p-reveal .a { color: var(--muted); }
    .p-reveal .lines div { margin-top: 4px; font-weight: 600; font-size: .92em; }
    .p-buzz { min-height: 45vh; font: inherit; font-size: 2.2em; font-weight: 900; border-radius: 22px; border: 6px solid var(--c);
      background: color-mix(in srgb, var(--c) 45%, var(--panel)); color: #fff; touch-action: manipulation; user-select: none; }
    .p-buzz:active:not(:disabled) { background: var(--c); transform: scale(.98); }
    .p-buzz.locked { opacity: .35; }
    .p-actions { display: flex; flex-direction: column; gap: 10px; }
    .p-actions button { font: inherit; font-size: 1.05em; padding: 14px; border-radius: 12px; border: 1px solid #3d3755; background: var(--panel-2); color: var(--text); }
    .p-actions button.primary { background: var(--accent); border: 0; font-weight: 700; }
    .p-actions button.gold { background: var(--gold); color: #2b2000; border: 0; font-weight: 700; }
    .p-actions button.ok { background: var(--ok); color: #0b1d12; border: 0; font-weight: 700; }
    .p-actions button:disabled { opacity: .4; }
    .vtl { display: flex; flex-direction: column; gap: 6px; }
    .vtl-title { font-weight: 800; color: var(--accent); margin-top: 4px; }
    .vtl-hint { color: var(--muted); font-size: .75em; text-align: center; }
    .vrow { display: flex; align-items: center; gap: 12px; border-radius: 12px; padding: 8px 12px; min-height: 52px; }
    .vrow.vcard { background: linear-gradient(160deg, #3a2d63, #2a2244); }
    .vrow.vnew { outline: 3px solid var(--ok); }
    .vrow.vstart { background: transparent; border: 2px dashed var(--gold); }
    .vrow .y { font-size: 1.5em; font-weight: 900; color: var(--gold); min-width: 3.2em; }
    .vrow .ta { display: flex; flex-direction: column; min-width: 0; }
    .vrow .ta b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vrow .ta small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vrow.vmys { background: var(--accent); color: #fff; font-weight: 800; }
    .vrow.vmys.ch { background: var(--gold); color: #2b2000; }
    .vrow.vmys .q { font-size: 1.6em; }
    .vrow.vmark { border: 2px dashed; font-weight: 800; justify-content: center; }
    .vrow.vmark.bad { color: var(--bad); } .vrow.vmark.ok { color: var(--ok); } .vrow.vmark.challenge { color: var(--gold); }
    .vslot { font: inherit; font-weight: 700; color: var(--accent-2); background: rgba(45, 226, 230, .08); border: 2px dashed var(--accent-2);
      border-radius: 12px; padding: 12px; touch-action: manipulation; }
    .vslot.chosen { background: var(--accent-2); color: #12101a; }
    .p-scores { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .85em; border-top: 1px solid #3d3755; padding-top: 10px; }
    .p-scores b { color: var(--text); }
    .p-scores .act { color: var(--accent); }
    body.player .guess-form input { font-size: 1.05em; padding: 12px; }
    body.player .guess-form button { font-size: 1.05em; padding: 12px; flex: 1 1 100%; border-radius: 12px; }
    body.player .timelines { flex: none; align-content: start; }
    body.player .tl-name { width: 20vw; }
    body.player .wrap { height: auto; min-height: 100%; }
    /* lobby i wybór trybu na dużym ekranie */
    .modes-board { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2vh; }
    .mb-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 2vw; }
    .mb-head h1 { font-size: 2em; margin: .1em 0 0; }
    .mb-join { color: var(--gold); font-weight: 800; font-size: 1.1em; }
    .mb-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: 1.5vh 1.5vw; align-content: center; }
    .mb-tile { background: var(--panel); border-radius: calc(16 * var(--u)); padding: .8em 1em; border: calc(3 * var(--u)) solid transparent; }
    .mb-tile.voted { border-color: var(--gold); }
    .mb-tile.off { opacity: .4; }
    .mb-icon { font-size: 1.6em; }
    .mb-title { font-weight: 800; font-size: 1.05em; }
    .mb-votes { color: var(--gold); font-weight: 700; font-size: .8em; min-height: 1.2em; }
    .mb-hint { color: var(--muted); text-align: center; margin: 0; }
    .end-next { color: var(--accent-2); font-size: 1.2em; }
    /* telefon gracza: głosowanie, oczekiwanie, impreza */
    .vote-view h2 { margin: .3em 0 0; }
    .vote-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

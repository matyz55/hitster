name: Testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # testy bez sieci (iTunes podstawiony); testy wielu urządzeń (@net) korzystają z publicznych serwerów,
      # więc ich błąd nie zatrzymuje całego sprawdzenia
      - run: npx playwright test --grep-invert @net
      - run: npx playwright test --grep @net
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

name: Sprawdzanie fragmentów iTunes

# codziennie porcja 150 piosenek (cała baza mniej więcej w 5–6 tygodni); można też uruchomić ręcznie
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ile piosenek sprawdzić'
        default: '150'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-previews.mjs --limit ${{ github.event.inputs.limit || '150' }}
      - name: Zapis raportu
        run: |
          git config user.name "songster-bot"
          git config user.email "songster-bot@users.noreply.github.com"
          git add tools/preview-check.json PREVIEW-REPORT.md
          git diff --cached --quiet || git commit -m "Raport fragmentów iTunes ($(date +%F))"
          git push
